name: aigame-dev

services:
  database:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aigame}
      POSTGRES_USER: ${POSTGRES_USER:-aigame}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Server/docker/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - aigame-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-aigame}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-aigame}?sslmode=disable
      ROOM_SERVICE_TOKEN: ${ROOM_SERVICE_TOKEN:?set ROOM_SERVICE_TOKEN in Server/docker/.env}
      ALLOW_LOOPBACK_HTTP: "1"
      ALLOW_DEV_DOCKER_HTTP: "1"
      BACKEND_BIND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      ROOM_HOST: ${ROOM_HOST:?set ROOM_HOST in Server/docker/.env}
      ROOM_PORT: ${ROOM_PORT:-17000}
      G0_DEV_USERNAME: ${G0_DEV_USERNAME:-dev}
      G0_TEST_PASSWORD: ${G0_DEV_PASSWORD:?set G0_DEV_PASSWORD in Server/docker/.env}
    ports:
      - "${BACKEND_BIND_IP:-0.0.0.0}:${BACKEND_PORT:-18080}:8000"
    depends_on:
      database:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["/app/backend migrate && /app/backend seed $${G0_DEV_USERNAME:-dev} && exec /app/backend"]

  game-server:
    build:
      context: ..
      dockerfile: docker/gameserver.Dockerfile
    restart: unless-stopped
    environment:
      G0_BACKEND_URL: http://backend:8000
      ROOM_SERVICE_TOKEN: ${ROOM_SERVICE_TOKEN:?set ROOM_SERVICE_TOKEN in Server/docker/.env}
      ROOM_ID: ${ROOM_ID:-g0-room}
      ROOM_PRESET: ${ROOM_PRESET:-exploration}
      ROOM_PORT: ${ROOM_PORT:-17000}
      ROOM_HOST: ${ROOM_HOST:?set ROOM_HOST in Server/docker/.env}
      G0_LOOPBACK_TEST: "0"
      G0_PROTECTED_NETWORK: "1"
    ports:
      - "${ROOM_BIND_IP:-0.0.0.0}:${ROOM_PORT:-17000}:${ROOM_PORT:-17000}/udp"
    depends_on:
      backend:
        condition: service_started

volumes:
  aigame-dev-postgres:
